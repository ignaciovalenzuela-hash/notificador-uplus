<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificador Inteligente U+ (V.2)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const SearchIcon = () => <svg className="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>;
        const MailIcon = () => <svg className="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>;

        const normalize = (str) => {
            if (!str) return "";
            return str.toString().normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().trim();
        };

        const cleanRut = (rut) => {
            if (!rut) return "";
            return String(rut).replace(/[^0-9Kk]/g, "").toUpperCase();
        };

        const fuzzyMatch = (name1, name2) => {
            const n1 = normalize(name1).replace(/[^A-Z\s]/g, "");
            const n2 = normalize(name2).replace(/[^A-Z\s]/g, "");
            if (!n1 || !n2) return false;
            const stopwords = ['DE', 'DEL', 'LA', 'LAS', 'LOS', 'Y'];
            const w1 = n1.split(' ').filter(w => w.length > 2 && !stopwords.includes(w));
            const w2 = n2.split(' ').filter(w => w.length > 2 && !stopwords.includes(w));
            
            let matches = 0;
            w1.forEach(w => { if (w2.includes(w)) matches++; });
            return matches >= 2 && matches >= (Math.min(w1.length, w2.length) - 1);
        };

        function App() {
            const [alumnos, setAlumnos] = useState([]);
            const [docentes, setDocentes] = useState([]);
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedAlumno, setSelectedAlumno] = useState(null);
            const [loading, setLoading] = useState(true);
            const [loadStatus, setLoadStatus] = useState([]);
            const [motivo, setMotivo] = useState('extension');
            const [fechaLimite, setFechaLimite] = useState('');

            useEffect(() => {
                const loadAllData = async () => {
                    setLoading(true);
                    let allAlumnos = [];
                    let statusLogs = [];

                    try {
                        const resDoc = await fetch('./docentes.xlsx');
                        if (resDoc.ok) {
                            const bufferDoc = await resDoc.arrayBuffer();
                            const wbDoc = window.XLSX.read(bufferDoc, { type: 'array' });
                            const dataDoc = window.XLSX.utils.sheet_to_json(wbDoc.Sheets[wbDoc.SheetNames[0]], { defval: "" });
                            setDocentes(dataDoc);
                            statusLogs.push(`✅ Docentes cargados (${dataDoc.length} registros)`);
                        }

                        const modalidades = ['diurno.xlsx', 'vespertino.xlsx', 'semipresencial.xlsx'];
                        
                        for (const file of modalidades) {
                            try {
                                const res = await fetch(`./${file}`);
                                if (res.ok) {
                                    const buffer = await res.arrayBuffer();
                                    const wb = window.XLSX.read(buffer, { type: 'array' });
                                    const data = window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
                                    const parsed = parseUplusV2(data);
                                    allAlumnos = [...allAlumnos, ...parsed];
                                    statusLogs.push(`✅ ${file} cargado (${parsed.length} alumnos)`);
                                } else {
                                    statusLogs.push(`⚠️ ${file} no encontrado`);
                                }
                            } catch (e) {
                                statusLogs.push(`❌ Error leyendo ${file}`);
                            }
                        }

                        setAlumnos(allAlumnos);
                        setLoadStatus(statusLogs);
                    } catch (err) {
                        console.error(err);
                    } finally {
                        setLoading(false);
                    }
                };

                loadAllData();
            }, []);

            // LÓGICA V.2 - EXTRACCIÓN RESTAURADA Y REFORZADA
            const parseUplusV2 = (data) => {
                let currentAlumno = null;
                let parsedAlumnos = [];
                
                for (let i = 0; i < data.length; i++) {
                    const row = data[i];
                    
                    const values = Object.values(row).map(v => String(v).trim());
                    const cargaIndex = values.indexOf('CARGA ACADÉMICA DEFINITIVA');
                    
                    if (cargaIndex !== -1 && data[i+1]) {
                        const nameValues = Object.values(data[i+1]);
                        const rutValues = Object.values(data[i+2] || {});
                        
                        const name = String(nameValues[cargaIndex] || nameValues.find(v => v) || '').trim();
                        
                        // V.2: Buscamos explícitamente en los valores de la fila 2 algo que contenga un guion (-) 
                        // o que se parezca al RUT, evitando extraer espacios en blanco por celdas combinadas.
                        let rutRaw = String(rutValues[cargaIndex] || '').trim();
                        
                        if (!rutRaw || !rutRaw.includes('-')) {
                            // Red de seguridad: si no estaba en la columna exacta, revisa toda la fila
                            const posibleRut = rutValues.find(v => String(v).includes('-'));
                            if (posibleRut) rutRaw = String(posibleRut).trim();
                        }
                        
                        if (name && name !== 'Nombre Ramo') {
                            currentAlumno = { nombre: name, rut: rutRaw, asignaturas: [] };
                            parsedAlumnos.push(currentAlumno);
                        }
                    }
                    
                    if (currentAlumno) {
                        const val3 = String(row['Data.Column3'] || row.__EMPTY_2 || values[2] || '').trim();
                        const sec = String(row['Data.Column5'] || row.__EMPTY_4 || values[4] || '').trim();
                        const prof = String(row['Data.Column7'] || row.__EMPTY_6 || values[6] || '').trim();

                        if (val3 && val3 !== 'Nombre Ramo' && val3 !== 'CARGA ACADÉMICA DEFINITIVA') {
                            if (sec && !isNaN(parseInt(sec))) {
                                currentAlumno.asignaturas.push({
                                    nombre: val3,
                                    seccion: sec,
                                    profesor: prof
                                });
                            }
                        }
                    }
                }
                return parsedAlumnos;
            };

            const getDocenteEmail = (ramo, seccion, profesor) => {
                const ramoClean = normalize(ramo);
                const secClean = normalize(seccion);
                
                for (let doc of docentes) {
                    const docSubj = normalize(doc['Nombre'] || doc['Asignatura']);
                    const docSec = normalize(doc['Codsecc'] || doc['Sección']);
                    if (docSubj === ramoClean && docSec === secClean) {
                        return doc['CORREO INSTITUCIONAL'] || doc['Correo'] || "";
                    }
                }
                
                if (profesor && profesor !== 'Profesor') {
                    for (let doc of docentes) {
                        const docName = doc['NombreProfe'] || doc['Profesor'];
                        if (docName && fuzzyMatch(profesor, docName)) {
                            return doc['CORREO INSTITUCIONAL'] || doc['Correo'] || "";
                        }
                    }
                }
                return "";
            };

            const handleMailTo = (alumno) => {
                const correosRaw = alumno.asignaturas.map(a => getDocenteEmail(a.nombre, a.seccion, a.profesor));
                const correosValidos = correosRaw.filter(c => c && c.includes('@'));
                const unicos = [...new Set(correosValidos)].join(';');

                if (!unicos) {
                    alert("No se encontraron correos para abrir Outlook.");
                    return;
                }

                let subject = `Situación académica estudiante ${alumno.nombre}`;
                let body = `Estimados docentes,\n\nJunto con saludar, les escribo en relación a la/el estudiante ${alumno.nombre} (RUT: ${alumno.rut ? alumno.rut : 'Sin registro'}).\n\n`;
                
                if (motivo === 'extension') {
                    body += `El motivo de este correo es solicitar una extensión de plazo para sus evaluaciones${fechaLimite ? ` hasta el día ${fechaLimite}` : ''}.\n\n`;
                } else if (motivo === 'justificacion') {
                    body += `El motivo de este correo es informar que el estudiante ha presentado justificativo válido.\n\n`;
                } else {
                    body += `[Escriba su mensaje aquí]\n\n`;
                }
                body += `Saludos cordiales.`;

                window.open(`mailto:?bcc=${encodeURIComponent(unicos)}&subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`);
            };

            const filteredAlumnos = alumnos.filter(a => {
                if (!searchTerm) return true;
                
                const searchLower = normalize(searchTerm);
                const nombreLimpio = normalize(a.nombre);
                const searchRutClean = cleanRut(searchTerm);
                const studentRutClean = cleanRut(a.rut);
                
                const matchNombre = nombreLimpio.includes(searchLower);
                // Si el estudiante tiene un RUT válido extraído, y lo que buscas tiene al menos 3 números, busca coincidencia
                const matchRut = searchRutClean.length >= 3 && studentRutClean.includes(searchRutClean);
                
                return matchNombre || matchRut;
            });

            if (loading) {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen bg-gray-100">
                        <div className="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                        <h2 className="text-xl font-bold">Cargando datos V.2...</h2>
                    </div>
                );
            }

            return (
                <div className="max-w-4xl mx-auto p-6 mt-8">
                    <div className="flex justify-between items-center mb-2 border-b-2 border-blue-500 pb-2">
                        <h1 className="text-3xl font-bold text-blue-800">Notificador U+ Global</h1>
                        <span className="bg-blue-600 text-white text-sm font-bold px-3 py-1 rounded-full shadow">V.2</span>
                    </div>
                    
                    <div className="bg-white p-3 rounded-lg shadow-sm mb-6 flex flex-wrap gap-4 text-xs text-gray-600">
                        {loadStatus.map((status, idx) => (
                            <span key={idx} className={status.includes('❌') ? 'text-red-600' : status.includes('⚠️') ? 'text-yellow-600' : 'text-green-700'}>{status}</span>
                        ))}
                    </div>

                    <div className="bg-white p-6 rounded-lg shadow-md mb-8 border-t-4 border-blue-600">
                        <h2 className="text-xl font-semibold mb-4">Buscar Estudiante ({alumnos.length} en total)</h2>
                        <div className="relative mb-6">
                            <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><SearchIcon /></div>
                            <input 
                                type="text" 
                                placeholder="Buscar por Nombre o RUT (ej: 12345678-9 o 123456789)..." 
                                className="w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 text-lg shadow-sm"
                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}
                            />
                        </div>

                        {searchTerm.length > 0 && (
                            <div className="max-h-60 overflow-y-auto border border-gray-200 rounded-lg bg-gray-50">
                                {filteredAlumnos.map((a, idx) => (
                                    <div key={idx} className={`p-3 border-b border-gray-200 cursor-pointer hover:bg-blue-50 ${selectedAlumno === a ? 'bg-blue-100 border-l-4 border-blue-600' : ''}`} onClick={() => setSelectedAlumno(a)}>
                                        <p className="font-semibold">{a.nombre}</p>
                                        <p className="text-sm font-mono text-gray-600 bg-gray-200 inline-block px-2 py-0.5 rounded mt-1">RUT: {a.rut ? a.rut : 'No encontrado'}</p>
                                        <p className="text-sm text-gray-500 mt-1">{a.asignaturas.length} asignaturas registradas</p>
                                    </div>
                                ))}
                                {filteredAlumnos.length === 0 && (
                                    <p className="p-4 text-center text-gray-500">No se encontraron resultados para "{searchTerm}".</p>
                                )}
                            </div>
                        )}
                    </div>

                    {selectedAlumno && (
                        <div className="bg-white p-6 rounded-lg shadow-md border-t-4 border-green-500">
                            <h2 className="text-xl font-semibold mb-4">Configurar Correo: <span className="text-blue-700">{selectedAlumno.nombre}</span></h2>
                            
                            <div className="mb-6 bg-gray-50 p-4 rounded-lg border border-gray-200">
                                <ul className="text-sm space-y-2">
                                    {selectedAlumno.asignaturas.map((asig, i) => {
                                        const email = getDocenteEmail(asig.nombre, asig.seccion, asig.profesor);
                                        return (
                                            <li key={i} className="flex justify-between border-b pb-2">
                                                <span>{asig.nombre} (Sec. {asig.seccion})</span>
                                                <span className={email ? "text-green-700 font-bold" : "text-red-600"}>{email || "Sin correo"}</span>
                                            </li>
                                        );
                                    })}
                                </ul>
                            </div>

                            <div className="grid grid-cols-2 gap-4 mb-6">
                                <div>
                                    <select className="w-full border p-3 rounded-lg bg-white" value={motivo} onChange={(e) => setMotivo(e.target.value)}>
                                        <option value="extension">Extensión de Plazos</option>
                                        <option value="justificacion">Justificación Médica</option>
                                        <option value="libre">Mensaje Libre</option>
                                    </select>
                                </div>
                                {motivo === 'extension' && (
                                    <input type="date" className="w-full border p-3 rounded-lg" value={fechaLimite} onChange={(e) => setFechaLimite(e.target.value)} />
                                )}
                            </div>

                            <button onClick={() => handleMailTo(selectedAlumno)} className="w-full bg-blue-600 hover:bg-blue-700 transition-colors text-white font-bold py-3 rounded-lg flex justify-center gap-2">
                                <MailIcon /> Redactar Correo
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
